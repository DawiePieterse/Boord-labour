<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boord Labour</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Labour">
<meta name="theme-color" content="#0A2F6B">
<script src="shared/tailwind.js"></script>
<link rel="stylesheet" href="shared/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="shared/styles.css">
<script src="shared/api.js"></script>
<script src="idb.js"></script>
<script src="shared/vendor/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-20">

<div class="boord-header p-3">
  <div class="flex items-center justify-between max-w-2xl mx-auto">
    <div>
      <div class="font-bold text-lg">Boord Labour</div>
      <button class="text-xs opacity-80 underline decoration-dotted" id="deviceLabel" title="Rename this phone"></button>
    </div>
    <div class="text-right text-xs">
      <div id="syncStatus" class="px-2 py-1 rounded-full bg-white/20">starting...</div>
      <div id="appVersion" class="opacity-60 mt-1"></div>
    </div>
  </div>
</div>

<main class="p-3 max-w-2xl mx-auto">

  <!-- Scan -->
  <section data-tab="scan" class="space-y-3">
    <div class="bg-white rounded-xl shadow p-3">
      <div id="qrReader" class="w-full rounded-lg overflow-hidden bg-black min-h-[240px]"></div>
      <button id="cameraBtn" class="hidden w-full mt-3 boord-btn-primary rounded-xl py-3 text-lg font-bold">
        <i class="fa-solid fa-camera"></i> Start camera
      </button>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white rounded-xl shadow p-3 text-center">
        <div class="text-xs text-slate-500">Inside now</div>
        <div class="text-3xl font-bold" id="insideCount">0</div>
      </div>
      <div class="bg-white rounded-xl shadow p-3 text-center">
        <div class="text-xs text-slate-500">Waiting to sync</div>
        <div class="text-3xl font-bold" id="pendingCount">0</div>
      </div>
    </div>
    <div class="bg-white rounded-xl shadow p-3">
      <div class="font-semibold mb-2">Last scans on this phone</div>
      <ul id="recentList" class="divide-y text-sm"></ul>
    </div>
  </section>

  <!-- Inside -->
  <section data-tab="today" class="space-y-3 hidden">
    <div class="bg-white rounded-xl shadow p-3">
      <div class="font-semibold mb-2">Inside the packhouse now</div>
      <ul id="presenceList" class="divide-y text-sm"></ul>
    </div>
  </section>

</main>

<!-- Scan result: full screen, so it reads from across the doorway. -->
<div id="result" class="hidden fixed inset-0 z-40 flex flex-col items-center justify-center text-white p-6 text-center">
  <img id="resultPhoto" class="hidden w-40 h-40 rounded-full object-cover border-4 border-white mb-4" alt="">
  <div id="resultDir" class="text-7xl font-black tracking-wider"></div>
  <div id="resultName" class="text-3xl font-bold mt-3"></div>
  <div id="resultTime" class="text-xl opacity-90 mt-1"></div>
  <button id="resultFlip" class="mt-8 bg-white/25 rounded-xl px-5 py-3 text-lg font-semibold"></button>
  <button id="resultClose" class="mt-3 underline opacity-90">Done</button>
</div>

<nav class="fixed bottom-0 inset-x-0 bg-white border-t grid grid-cols-2 text-xs z-30">
  <button data-nav="scan" class="py-2"><i class="fa-solid fa-qrcode text-lg block"></i>Scan</button>
  <button data-nav="today" class="py-2"><i class="fa-solid fa-users text-lg block"></i>Inside</button>
</nav>

<script src="app.js"></script>
</body>
</html>
